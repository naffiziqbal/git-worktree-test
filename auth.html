<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a2330;
      --muted: #5c6b7a;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --border: rgba(26, 35, 48, 0.12);
      --input-bg: #f8fafb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(13, 148, 136, 0.12), transparent),
        radial-gradient(ellipse 50% 35% at 100% 100%, rgba(100, 116, 200, 0.08), transparent);
    }

    .panel {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 40px -28px rgba(26, 35, 48, 0.35);
    }

    .panel h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .panel .sub {
      font-size: 0.9375rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .field {
      margin-bottom: 1.1rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
      background: #fff;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      width: 1rem;
      height: 1rem;
      accent-color: var(--accent);
    }

    a.link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
    }

    a.link:hover {
      text-decoration: underline;
      color: var(--accent-hover);
    }

    button[type="submit"] {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    .footer {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .back {
      display: inline-block;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="panel">
    <a class="back" href="index.html">← Back</a>
    <h1>Login in</h1>
    <p class="sub">Enter your email and password to continue.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      </div>
      <div class="row">
        <label class="remember">
          <input type="checkbox" name="remember" value="1" />
          Remember me
        </label>
        <a class="link" href="#">Forgot password?</a>
      </div>
      <button type="submit">Sign in</button>
    </form>

    <p class="footer">
      No account? <a href="#">Create one</a>
    </p>
  </div>
</body>
</html>
